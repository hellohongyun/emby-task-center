# 独立 GHCR 部署模板：复制到服务器的应用目录，无需 .env 或源码。
# Linux Host 网络；latest 跟随最新正式版本，更新时执行 pull 与 up。
name: emby-task-center

services:
  app:
    image: ghcr.io/hellohongyun/emby-task-center:latest
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_PATH: /data/emby-task-center.db
      WEB_DIST_PATH: /app/public
    volumes:
      - type: bind
        source: ./data
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
