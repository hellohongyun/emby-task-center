# 源码构建与隔离测试专用；镜像部署使用 compose.yaml。
name: emby-task-center

services:
  app:
    image: emby-task-center:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      PORT: "3000"
      DATABASE_PATH: /data/emby-task-center.db
      WEB_DIST_PATH: /app/public
    volumes:
      - type: bind
        source: "${DATA_PATH:-./data}"
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
